# Local production-like stack: app + PostgreSQL 16.
# Usage:  docker compose up --build
# Webhook: expose port 8000 to Meta via a tunnel (see docs/DEPLOYMENT.md).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roomlens
      POSTGRES_PASSWORD: roomlens
      POSTGRES_DB: roomlens
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomlens -d roomlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://roomlens:roomlens@db:5432/roomlens
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN:-dev-token}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      MEDIA_BACKEND: local
      MEDIA_DIR: /app/data/media
      DEFAULT_LANGUAGE: en
    ports:
      - "8000:8000"
    volumes:
      - mediadata:/app/data/media
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  mediadata:
