name: Question
description: Ask about using, deploying, or extending RoomLens
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What's unclear? Check docs/FAQ.md first — it answers the common ones.
      placeholder: Do I need a separate Meta template per language for campaigns?
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Usage (designer / prospect)
        - Deployment / Meta setup
        - Development / contributing
        - Other
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I checked docs/FAQ.md and docs/TROUBLESHOOTING.md first
          required: true
        - label: My question contains no secrets, tokens, or phone numbers
          required: true
