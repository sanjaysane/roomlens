name: Bug report
description: Report something broken in RoomLens
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include tokens, phone numbers,
        or other secrets — redact them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs what you saw.
      placeholder: I sent a room photo and got the "unreadable" retake three times…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh chat if possible.
      placeholder: |
        1. Messaged the RoomLens number
        2. Replied 2, picked studio 1
        3. Sent a well-lit room photo
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prospect flow (photo → preview → order)
        - Designer flow (catalog → studio → orders → marketing)
        - Webhook / Meta integration
        - Compositing / quality gate
        - Media (download / upload / storage)
        - i18n / locales
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version or git SHA you ran.
      placeholder: 0.1.0 (abc1234)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (redact tokens and phone numbers).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I redacted all secrets, tokens, and phone numbers
          required: true
        - label: I checked docs/TROUBLESHOOTING.md first
          required: false
