name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roomlens
          POSTGRES_PASSWORD: roomlens
          POSTGRES_DB: roomlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roomlens -d roomlens"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Apply schema
        env:
          PGPASSWORD: roomlens
        run: psql -h localhost -U roomlens -d roomlens -v ON_ERROR_STOP=1 -f sql/schema.sql
      - name: Ruff
        run: ruff check src tests
      - name: Pytest with coverage (incl. real PostgreSQL)
        env:
          DATABASE_URL: postgresql://roomlens:roomlens@localhost:5432/roomlens
        run: |
          pytest tests/ -q --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t roomlens:ci .
